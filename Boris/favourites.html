          <h1>My Favorite Songs</h1>
        <section class="playlist" style="display:block;">
            <h2>Favorite Playlist</h2>
            <ul id="favourites-list">
                <!-- Dynamically populated from localStorage -->

            <p id="empty-message" style="text-align: center; color: #cfe8ef; font-size: 16px;">No favourite songs yet. Add some from the Mood page!</p>

<script src="mood.js"></script>
<script>
// Load and display favourites on page load
function loadFavourites(){
    const favourites = getFavourites();
    const list = document.getElementById('favourites-list');
    const emptyMessage = document.getElementById('empty-message');
    
    list.innerHTML = '';
    
    if(favourites.length === 0){
        emptyMessage.style.display = 'block';
    } else {
        emptyMessage.style.display = 'none';
        favourites.forEach((song, index) => {
            const li = document.createElement('li');
            li.className = 'song-item fav-item';
            
            let songContent = '';
            if(song.url){
                songContent = `<a href="${song.url}" target="_blank">${song.title}</a>`;
            } else {
                songContent = song.title;
            }
            
            li.innerHTML = `
                <div class="song-content">
                    ${songContent}
                </div>
                <button class="song-btn remove-btn" onclick="removeFavouriteFromFavourites(${index})" title="Remove from favourites">🗑</button>
            `;
            
            list.appendChild(li);
        });
    }
}

// Remove from favourites (called from favourites page)
function removeFavouriteFromFavourites(index){
    const favourites = getFavourites();
    if(index >= 0 && index < favourites.length){
        const song = favourites[index];
        favourites.splice(index, 1);
        saveFavourites(favourites);
        showNotification('✓ Song removed from favourites', 'success');
        loadFavourites();
    }
}

document.addEventListener('DOMContentLoaded', loadFavourites);
</script>
